services:
  # Bundled Postgres — only starts under the `dev` profile.
  # In production (Coolify) we point at the externally-managed database via DATABASE_URL,
  # so this service stays inert unless you opt-in with COMPOSE_PROFILES=dev.
  db:
    image: postgres:16-alpine
    container_name: gradnadlanu-db
    restart: unless-stopped
    profiles: ["dev"]
    environment:
      # Required — set these in .env. The compose file refuses to start the dev
      # DB with a placeholder password to avoid shipping well-known creds.
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER is required in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required in .env}
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB is required in .env}
    ports:
      # Bound to localhost only — the bundled dev DB shouldn't be reachable
      # from other hosts on the LAN.
      - "127.0.0.1:${DB_HOST_PORT:-5433}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  app:
    build: .
    container_name: gradnadlanu-app
    restart: unless-stopped
    environment:
      # Production: set this in Coolify's env panel to point at the managed Postgres,
      # e.g. postgres://USER:PASS@yssskgs8o48cs08k0o48ss4s:5432/gradnadlanu
      # Dev fallback: the bundled `db` service via the internal hostname.
      DATABASE_URL: ${DATABASE_URL:-postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}}
      # Fail-fast required env. Must be set in Coolify's env panel.
      # JWT_SECRET: 32+ chars, not the .env.example placeholder (validated at boot).
      # ADMIN_PASSWORD: required in production, 12+ chars, not a weak well-known value.
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?ADMIN_PASSWORD is required (12+ chars, not "admin")}
      PORT: 3000
      NODE_ENV: production
      RUN_MIGRATIONS_ON_BOOT: "true"
      RUN_SEED_ON_BOOT: ${RUN_SEED_ON_BOOT:-false}
      CORS_ORIGIN: ${CORS_ORIGIN:-}
      # Where uploaded photos live. In Coolify, attach a Persistent Storage mount
      # to this path so images survive image rebuilds.
      UPLOAD_DIR: ${UPLOAD_DIR:-/data/uploads}
      # Rolling daily logs: ${LOG_DIR}/zabariYYYY-MM-DD.log, retention of N days.
      # In Coolify, attach a Persistent Storage mount to /storage/logs so the
      # files survive image rebuilds.
      LOG_DIR: ${LOG_DIR:-/storage/logs}
      LOG_RETENTION_DAYS: ${LOG_RETENTION_DAYS:-7}
    # Soft dependency — waits for db when COMPOSE_PROFILES=dev is set, ignored
    # in production (Coolify) where the managed Postgres is reached over its own network.
    depends_on:
      db:
        condition: service_healthy
        required: false
    # Coolify reads these to provision a domain + Let's Encrypt cert via Traefik.
    # Set APP_DOMAIN in Coolify's env panel (e.g. gradnadlanu.example.com).
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.gradnadlanu.rule=Host(`${APP_DOMAIN:-localhost}`)"
      - "traefik.http.routers.gradnadlanu.entrypoints=websecure"
      - "traefik.http.routers.gradnadlanu.tls=true"
      - "traefik.http.routers.gradnadlanu.tls.certresolver=letsencrypt"
      - "traefik.http.services.gradnadlanu.loadbalancer.server.port=3000"
    # Local-only port mapping — comment out / remove on Coolify (Traefik handles routing).
    ports:
      - "${APP_HOST_PORT:-3000}:3000"
    # Persistent storage. In dev these use named docker volumes; in Coolify, add
    # Persistent Storage mounts that map to /data/uploads and /storage/logs.
    volumes:
      - uploads:/data/uploads
      - logs:/storage/logs
    # Attach to Coolify's shared overlay network so the app can resolve the managed
    # Postgres hostname. `default` is the implicit per-stack network; `coolify` is the
    # external network created by Coolify when you provisioned the database.
    networks:
      - default
      - coolify

volumes:
  pgdata:
  uploads:
  logs:

networks:
  coolify:
    external: true
    name: coolify
