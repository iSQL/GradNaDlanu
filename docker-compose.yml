services:
  # Bundled Postgres — only starts under the `dev` profile.
  # In production (Coolify) we point at the externally-managed database via DATABASE_URL,
  # so this service stays inert unless you opt-in with COMPOSE_PROFILES=dev.
  db:
    image: postgres:16-alpine
    container_name: gradnadlanu-db
    restart: unless-stopped
    profiles: ["dev"]
    environment:
      # Required — set these in .env. The compose file refuses to start the dev
      # DB with a placeholder password to avoid shipping well-known creds.
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER is required in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required in .env}
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB is required in .env}
    ports:
      # Bound to localhost only — the bundled dev DB shouldn't be reachable
      # from other hosts on the LAN.
      - "127.0.0.1:${DB_HOST_PORT:-5433}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  app:
    build: .
    container_name: gradnadlanu-app
    restart: unless-stopped
    environment:
      # Production: set this in Coolify's env panel to point at the managed Postgres,
      # e.g. postgres://USER:PASS@yssskgs8o48cs08k0o48ss4s:5432/gradnadlanu
      # Dev fallback: the bundled `db` service via the internal hostname.
      DATABASE_URL: ${DATABASE_URL:-postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}}
      # Fail-fast required env. Must be set in Coolify's env panel.
      # JWT_SECRET: 32+ chars, not the .env.example placeholder (validated at boot).
      # ADMIN_PASSWORD: required in production, 12+ chars, not a weak well-known value.
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?ADMIN_PASSWORD is required (12+ chars, not "admin")}
      PORT: 3000
      NODE_ENV: production
      RUN_MIGRATIONS_ON_BOOT: "true"
      RUN_SEED_ON_BOOT: ${RUN_SEED_ON_BOOT:-false}
      CORS_ORIGIN: ${CORS_ORIGIN:-}
      # Where uploaded photos live. In Coolify, attach a Persistent Storage mount
      # to this path so images survive image rebuilds.
      UPLOAD_DIR: ${UPLOAD_DIR:-/data/uploads}
      # Rolling daily logs: ${LOG_DIR}/zabariYYYY-MM-DD.log, retention of N days.
      # In Coolify, attach a Persistent Storage mount to /storage/logs so the
      # files survive image rebuilds.
      LOG_DIR: ${LOG_DIR:-/storage/logs}
      LOG_RETENTION_DAYS: ${LOG_RETENTION_DAYS:-7}
    # Soft dependency — waits for db when COMPOSE_PROFILES=dev is set, ignored
    # in production (Coolify) where the managed Postgres is reached over its own network.
    depends_on:
      db:
        condition: service_healthy
        required: false
    # Coolify auto-generates the actual Traefik routers + services per app
    # (with UUID-unique names based on the "Domain" field in its UI) so each
    # env on the same host stays isolated. We only opt-in to Traefik routing
    # via the enable flag; defining our own routers/services here collides
    # with Coolify's by creating a shared, env-interpolation-broken service
    # pool that round-robins traffic across all containers.
    labels:
      - "traefik.enable=true"
      # Pin the network Traefik routes over. The container is attached to THREE
      # docker networks (Coolify's per-resource ingress net, the compose
      # `_default` net, and the shared `coolify` net). Traefik only sits on
      # `coolify` (10.0.1.x); without this label it picks one of the three
      # arbitrarily and, when it lands on the unreachable `_default` net, every
      # request times out → intermittent 504 while the container stays healthy.
      # Pinning to `coolify` makes routing deterministic over the one network
      # the proxy can always reach.
      - "traefik.docker.network=coolify"
    # Host port binding — bound to 127.0.0.1 ONLY so the backend isn't reachable
    # from the public internet (Traefik handles real traffic via the docker
    # network). Useful for SSH-tunnel debugging from the Coolify host. If you
    # run two Coolify envs on the same host (prod + demo), each MUST pick a
    # distinct APP_HOST_PORT (e.g. 3000 for prod, 3001 for demo) because docker
    # can't bind the same host port twice — even on loopback.
    ports:
      - "127.0.0.1:${APP_HOST_PORT:-3000}:3000"
    # Persistent storage.
    # - `uploads` is a named docker volume (dev) / Coolify Persistent Storage (prod) for photos.
    # - Logs are a HOST BIND so files end up on the Coolify host where the Loki
    #   collector tails them. Path is env-configurable: in prod set
    #   HOST_LOG_DIR=/var/lib/coolify/storage/logs/zabari in Coolify's env panel;
    #   in dev the default `./storage/logs` is a repo-local dir (gitignored) so
    #   `docker compose up` works on Windows/macOS without root-owned mounts.
    volumes:
      # Uploaded photos live on a Hetzner Volume (block storage) bind-mounted here.
      # Hardcoded absolute host path (NOT an env var) on purpose: Coolify does not
      # apply ${VAR} interpolation to compose volume *sources* — it evaluates the
      # `:-` default at parse time, so an env-driven source silently falls back to a
      # named volume on the root disk. Same hardcoded-bind pattern as the logs mount
      # below; both surface in Coolify's Persistent Storage → Directories. Pre-create
      # the dir and `chown 1000:1000` it (the container's `node` user) or uploads
      # fail with EACCES. Local dev uses `npm run dev`, not this service.
      - /mnt/HC_Volume_106198997/zabari-uploads:/data/uploads
      - /var/lib/coolify/storage/logs/zabari:/storage/logs
    # Attach to Coolify's shared overlay network so the app can resolve the managed
    # Postgres hostname. `default` is the implicit per-stack network; `coolify` is the
    # external network created by Coolify when you provisioned the database.
    networks:
      - default
      - coolify

volumes:
  pgdata:

networks:
  coolify:
    external: true
    name: coolify
