services:
  db:
    image: postgres:16-alpine
    container_name: gradnadlanu-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: gradnadlanu
      POSTGRES_PASSWORD: gradnadlanu
      POSTGRES_DB: gradnadlanu
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gradnadlanu -d gradnadlanu"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
