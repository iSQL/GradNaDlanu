document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    const blobUrls = {};
    const resourceBlobs = {};
    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    for (const uuid of uuids) template = template.split(uuid).join(blobUrls[uuid]);

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);
    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

lay:inline-flex;align-items:center;gap:6px;padding:8px 13px;border:1px solid #CDBFAE;background:#F5EBE0;border-radius:999px;font-size:13px;font-weight:500;color:#26364A;cursor:pointer;\">\n                <svg width=\"15\" height=\"15\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z\"><\u002Fpath><\u002Fsvg>\n                {{ sel.comments }}\n              <\u002Fbutton>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsc-if>\n\n  <sc-if value=\"{{ addOpen }}\" hint-placeholder-val=\"{{ false }}\">\n    <div sc-camel-on-click=\"{{ closeAdd }}\" style=\"position:fixed;inset:0;z-index:2000;background:rgba(11,27,43,.5);backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px);display:grid;place-items:center;padding:24px;animation:biserFade .15s ease;\">\n      <div sc-camel-on-click=\"{{ stop }}\" style=\"width:100%;max-width:520px;max-height:90vh;overflow:auto;background:#F5EBE0;border:1px solid #E6DCD2;border-radius:14px;box-shadow:0 2px 0 rgba(29,53,87,.04),0 24px 60px rgba(29,53,87,.18);padding:24px 26px 26px;animation:biserCardIn .2s cubic-bezier(.34,1.56,.64,1);\">\n        <div style=\"display:flex;align-items:flex-start;justify-content:space-between;gap:12px;margin-bottom:6px;\">\n          <div>\n            <h2 style=\"font-family:'Marcellus',serif;font-weight:500;font-size:23px;color:#1D3557;margin:0;\">Dodaj biser<\u002Fh2>\n            <p style=\"font-size:12.5px;color:#5B5548;margin:5px 0 0;line-height:1.5;\">Podeli staru fotografiju sa pričom. Predlog ide kustosu sela na odobrenje.<\u002Fp>\n          <\u002Fdiv>\n          <button sc-camel-on-click=\"{{ closeAdd }}\" style=\"width:28px;height:28px;border-radius:50%;border:1px solid #E6DCD2;background:transparent;color:#5B5548;font-size:18px;line-height:1;cursor:pointer;display:grid;place-items:center;flex-shrink:0;\">×<\u002Fbutton>\n        <\u002Fdiv>\n\n        <div style=\"margin-top:16px;height:190px;border-radius:10px;overflow:hidden;border:1px dashed #CDBFAE;\">\n          <image-slot id=\"biser-new-photo\" shape=\"rect\" placeholder=\"Prevucite skeniranu fotografiju ovde\"><\u002Fimage-slot>\n        <\u002Fdiv>\n\n        <div style=\"display:flex;flex-direction:column;gap:14px;margin-top:16px;\">\n          <label style=\"display:flex;flex-direction:column;gap:6px;\">\n            <span style=\"font-size:11px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:#5B5548;opacity:.7;\">Naslov<\u002Fspan>\n            <input placeholder=\"npr. Pijaca na Trgu\" style=\"padding:10px 12px;border:1px solid #E6DCD2;border-radius:8px;background:#F5EBE0;font:inherit;font-size:14px;color:#26364A;outline:none;\">\n          <\u002Flabel>\n          <div style=\"display:flex;gap:12px;\">\n            <label style=\"display:flex;flex-direction:column;gap:6px;flex:0 0 120px;\">\n              <span style=\"font-size:11px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:#5B5548;opacity:.7;\">Godina<\u002Fspan>\n              <input placeholder=\"1963\" style=\"padding:10px 12px;border:1px solid #E6DCD2;border-radius:8px;background:#F5EBE0;font:inherit;font-size:14px;color:#26364A;outline:none;font-family:'JetBrains Mono',monospace;\">\n            <\u002Flabel>\n            <label style=\"display:flex;flex-direction:column;gap:6px;flex:1 1 auto;\">\n              <span style=\"font-size:11px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:#5B5548;opacity:.7;\">Selo<\u002Fspan>\n              <sc-raw-select style=\"padding:10px 12px;border:1px solid #E6DCD2;border-radius:8px;background:#F5EBE0;font:inherit;font-size:14px;color:#26364A;outline:none;\">\n                <sc-for list=\"{{ villageList }}\" as=\"v\" hint-placeholder-count=\"6\">\n                  <option value=\"{{ v }}\">{{ v }}<\u002Foption>\n                <\u002Fsc-for>\n              <\u002Fsc-raw-select>\n            <\u002Flabel>\n          <\u002Fdiv>\n          <label style=\"display:flex;flex-direction:column;gap:6px;\">\n            <span style=\"font-size:11px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:#5B5548;opacity:.7;\">Priča / anegdota<\u002Fspan>\n            <textarea rows=\"4\" placeholder=\"Šta se dešavalo na ovom mestu? Ko je na fotografiji?\" style=\"padding:10px 12px;border:1px solid #E6DCD2;border-radius:8px;background:#F5EBE0;font:inherit;font-size:14px;color:#26364A;outline:none;resize:vertical;line-height:1.5;\"><\u002Ftextarea>\n          <\u002Flabel>\n          <div style=\"display:flex;align-items:center;gap:10px;padding:12px 14px;background:#E6DCD2;border-radius:10px;font-size:12.5px;color:#26364A;\">\n            <svg width=\"18\" height=\"18\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"#1D3557\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\" style=\"flex-shrink:0;\"><path d=\"M12 21s-7-6-7-11a7 7 0 0 1 14 0c0 5-7 11-7 11z\"><\u002Fpath><circle cx=\"12\" cy=\"10\" r=\"2.5\"><\u002Fcircle><\u002Fsvg>\n            <span>Lokacija: <strong style=\"color:#1D3557;\">dugi klik na mapu<\u002Fstrong> da postaviš tačno mesto snimka.<\u002Fspan>\n          <\u002Fdiv>\n        <\u002Fdiv>\n\n        <div style=\"display:flex;gap:10px;margin-top:20px;\">\n          <button sc-camel-on-click=\"{{ closeAdd }}\" style=\"flex:0 0 auto;padding:12px 18px;background:transparent;border:1px solid #CDBFAE;border-radius:999px;font-weight:600;font-size:13.5px;color:#26364A;cursor:pointer;\">Otkaži<\u002Fbutton>\n          <button sc-camel-on-click=\"{{ closeAdd }}\" style=\"flex:1 1 auto;padding:12px 18px;background:#1D3557;color:#F5EBE0;border:none;border-radius:999px;font-weight:600;font-size:13.5px;letter-spacing:.02em;cursor:pointer;\">Pošalji na odobrenje<\u002Fbutton>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsc-if>\n\n<\u002Fdiv>\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{&quot;$preview&quot;:{&quot;width&quot;:1280,&quot;height&quot;:880}}\">\nclass Component extends DCLogic {\n  state = { decade: 'all', village: '', selected: null, thenNow: 'then', addOpen: false, menu: false };\n\n  BISERI = [\n    { id: 1, title: 'Pijaca na Trgu', year: 1963, village: 'Žabari', contributor: 'Dragan Petrović', initial: 'D', added: 'pre 3 dana', likes: 42, comments: 7, lat: 44.3572, lng: 21.2156, hue: 32,\n      story: ['Sredom i subotom Trg bi se ispunio tezgama još pre svitanja — seljaci iz okolnih sela dolazili su zapregama natovarenim jajima, sirom i ranim voćem.',\n              'Na ovom uglu, gde je danas parking, stajala je vaga opštinske pijace. Deca su se vrtela oko prodavca semenki, a stariji su uz kafu rešavali sve seoske teme.'] },\n    { id: 2, title: 'Stari most na Moravi', year: 1958, village: 'Žabari', contributor: 'Ljubica Nikolić', initial: 'Lj', added: 'pre 6 dana', likes: 68, comments: 12, lat: 44.3538, lng: 21.2204, hue: 26,\n      story: ['Drveni most je povezivao dve obale sve dok ga poplava 1962. nije odnela. Prelazilo se peške, biciklom i po kojim zaprežnim kolima.',\n              'Kažu da su se mladići nedeljom skupljali baš ovde, na ogradi mosta, i precima dobacivali devojkama koje su išle na korzo.'] },\n    { id: 3, title: 'Osnovna škola', year: 1971, village: 'Žabari', contributor: 'Milan Đorđević', initial: 'M', added: 'pre 1 nedelju', likes: 51, comments: 9, lat: 44.3559, lng: 21.2133, hue: 30,\n      story: ['Prvi dan škole, generacija 1971. Uniforme su bile tegljene i ispeglane, a tašne od skaja mirisale na novo.',\n              'Iza dece se vidi stara zgrada škole sa drvenim prozorima — danas na tom mestu stoji novo krilo, ali lipa iz dvorišta i dalje raste.'] },\n    { id: 4, title: 'Železnička stanica', year: 1952, village: 'Žabari', contributor: 'Radoslav Ilić', initial: 'R', added: 'pre 2 nedelje', likes: 37, comments: 5, lat: 44.3586, lng: 21.2188, hue: 24,\n      story: ['Uzani kolosek prolazio je kroz opštinu, a stanica je bila prozor u svet — odavde se putovalo u Požarevac na pijacu i u vojsku.',\n              'Skretničar Sava mahao je crvenom zastavicom svakog jutra u 6:40. Prugu su ukinuli sedamdesetih, ali peron se još nazire.'] },\n    { id: 5, title: 'Zadružni dom', year: 1975, village: 'Oreovica', contributor: 'Vera Stanković', initial: 'V', added: 'pre 2 nedelje', likes: 29, comments: 4, lat: 44.3551, lng: 21.2116, hue: 34,\n      story: ['Zadružni dom bio je srce sela — tu su se održavale igranke, projekcije filmova i seoske skupštine.',\n              'Na fotografiji je proslava povodom otkupa pšenice; harmonika je svirala do zore.'] },\n    { id: 6, title: 'Vašar krajem leta', year: 1962, village: 'Žabari', contributor: 'Đorđe Marić', initial: 'Đ', added: 'pre 3 nedelje', likes: 74, comments: 15, lat: 44.3579, lng: 21.2171, hue: 28,\n      story: ['Jednom godišnje vašar bi pretvorio livadu u vrtešku boja — ringišpil, šećerna vuna i grnčarija iz cele okoline.',\n              'Deca su štedela dinar po dinar ceo mesec za jednu vožnju na lančanoj vrtešci.'] },\n    { id: 7, title: 'Seoska slava', year: 1968, village: 'Simićevo', contributor: 'Nada Jovanović', initial: 'N', added: 'pre mesec dana', likes: 33, comments: 6, lat: 44.3565, lng: 21.2192, hue: 36,\n      story: ['Cela ulica se skupljala za slavskom trpezom postavljenom ispred kuće domaćina.',\n              'Kolo se vodilo nasred sokaka, a slavski kolač lomio se uz pesmu koja se čula do kraja sela.'] },\n  ];\n\n  componentDidMount() { this._waitForL(); }\n\n  componentDidUpdate(prevProps, prevState) {\n    if (prevState.decade !== this.state.decade || prevState.village !== this.state.village) this._syncMarkers();\n    if (this.state.selected && this.state.selected !== prevState.selected && this._map) {\n      const b = this._byId(this.state.selected);\n      if (b) this._map.flyTo([b.lat, b.lng], 17, { duration: 0.7 });\n    }\n  }\n\n  _waitForL() {\n    if (window.L) this._initMap();\n    else setTimeout(() => this._waitForL(), 60);\n  }\n\n  _initMap() {\n    const L = window.L;\n    const el = document.getElementById('biseri-map');\n    if (!el || this._map) return;\n    this._map = L.map(el, { center: [44.3567, 21.2161], zoom: 16, zoomControl: false, scrollWheelZoom: false, zoomSnap: 0.5 });\n    L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}', { maxZoom: 19, attribution: 'Tiles © Esri' }).addTo(this._map);\n    L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/Reference/World_Boundaries_and_Places/MapServer/tile/{z}/{y}/{x}', { maxZoom: 19, opacity: 0.9 }).addTo(this._map);\n    L.control.zoom({ position: 'bottomright' }).addTo(this._map);\n    this._layer = L.layerGroup().addTo(this._map);\n    this._syncMarkers();\n  }\n\n  _pinHtml(b) {\n    const c1 = `hsl(${b.hue}, 42%, 68%)`, c2 = `hsl(${b.hue}, 46%, 44%)`, c3 = `hsl(${b.hue}, 44%, 26%)`;\n    return `<div style=\"position:relative;width:54px;height:62px;cursor:pointer;\">\n      <span style=\"position:absolute;left:50%;top:26px;transform:translate(-50%,-50%);width:44px;height:44px;border-radius:50%;background:hsl(${b.hue},50%,50%);opacity:.4;animation:biserPulse 2.6s infinite;\"><\u002Fspan>\n      <div style=\"position:absolute;left:50%;top:2px;transform:translateX(-50%);width:50px;height:46px;border-radius:6px;padding:3px;background:#F5EBE0;box-shadow:0 4px 10px rgba(0,0,0,.45);\">\n        <div style=\"width:100%;height:100%;border-radius:3px;background:linear-gradient(155deg,${c1} 0%,${c2} 62%,${c3} 100%);position:relative;overflow:hidden;\">\n          <span style=\"position:absolute;left:0;right:0;top:52%;height:1px;background:rgba(255,255,255,.35);\"><\u002Fspan>\n          <span style=\"position:absolute;bottom:0;left:0;right:0;background:rgba(29,53,87,.85);color:#F5EBE0;font:600 9px 'Work Sans',sans-serif;text-align:center;padding:1px 0;letter-spacing:.03em;\">${b.year}.<\u002Fspan>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"position:absolute;left:50%;bottom:0;transform:translateX(-50%);width:0;height:0;border-left:7px solid transparent;border-right:7px solid transparent;border-top:9px solid #F5EBE0;filter:drop-shadow(0 3px 3px rgba(0,0,0,.35));\"><\u002Fdiv>\n    <\u002Fdiv>`;\n  }\n\n  _syncMarkers() {\n    if (!this._layer || !window.L) return;\n    const L = window.L;\n    this._layer.clearLayers();\n    for (const b of this._getFiltered()) {\n      const m = L.marker([b.lat, b.lng], { icon: L.divIcon({ className: 'biser-pin-icon', html: this._pinHtml(b), iconSize: [54, 62], iconAnchor: [27, 62] }) });\n      m.on('click', () => this.openDetail(b.id));\n      m.bindTooltip(`<b>${b.title}<\u002Fb><br>${b.year}. · ${b.village}`, { className: 'biser-tt', direction: 'top', offset: [0, -56] });\n      m.addTo(this._layer);\n    }\n  }\n\n  _decadeOf(y) { return String(Math.floor(y / 10) * 10); }\n  _byId(id) { return this.BISERI.find(b => b.id === id); }\n  _getFiltered() {\n    return this.BISERI.filter(b =>\n      (this.state.decade === 'all' || this._decadeOf(b.year) === this.state.decade) &&\n      (!this.state.village || b.village === this.state.village));\n  }\n\n  openDetail(id) { this.setState({ selected: id, thenNow: 'then' }); }\n  closeDetail() { this.setState({ selected: null }); }\n  openAdd() { this.setState({ addOpen: true }); }\n  closeAdd() { this.setState({ addOpen: false }); }\n  setThen() { this.setState({ thenNow: 'then' }); }\n  setNow() { this.setState({ thenNow: 'now' }); }\n\n  renderVals() {\n    const { decade, village, selected, thenNow, addOpen, menu } = this.state;\n    const chipBase = 'padding:8px 14px;border-radius:999px;font-size:12.5px;font-weight:600;cursor:pointer;transition:all .12s;letter-spacing:.01em;';\n    const on = 'background:#1D3557;color:#F5EBE0;border:1px solid #1D3557;';\n    const off = 'background:#F5EBE0;color:#5B5548;border:1px solid #E6DCD2;';\n    const defs = [['all', 'Sve'], ['1950', \"1950-e\"], ['1960', \"1960-e\"], ['1970', \"1970-e\"], ['1980', \"1980-e\"]];\n    const decades = defs.map(([value, label]) => ({\n      label, style: chipBase + (decade === value ? on : off),\n      onClick: () => this.setState({ decade: value }),\n    }));\n\n    const villageList = ['Žabari', 'Aleksandrovac', 'Brzohode', 'Vitežovo', 'Vlaški Do', 'Kočetin', 'Mirijevo', 'Oreovica', 'Polatna', 'Porodin', 'Svinjarevo', 'Sibnica', 'Simićevo', 'Tićevac', 'Četereže'];\n\n    const filtered = this._getFiltered();\n    const thumbFor = (b) => `linear-gradient(155deg,hsl(${b.hue},42%,66%) 0%,hsl(${b.hue},46%,42%) 62%,hsl(${b.hue},44%,25%) 100%)`;\n    const recent = filtered.map(b => ({\n      year: b.year, title: b.title, village: b.village, contributor: b.contributor,\n      likes: b.likes, comments: b.comments, thumb: thumbFor(b),\n      onClick: () => this.openDetail(b.id),\n    }));\n\n    const count = filtered.length;\n    const countSuffix = count === 1 ? 'a' : (count >= 2 && count <= 4 ? 'e' : 'a');\n\n    let sel = null;\n    const b = selected ? this._byId(selected) : null;\n    if (b) {\n      const tabOn = 'padding:6px 14px;border-radius:999px;border:none;font-size:12px;font-weight:600;cursor:pointer;background:#F5EBE0;color:#1D3557;';\n      const tabOff = 'padding:6px 14px;border-radius:999px;border:none;font-size:12px;font-weight:600;cursor:pointer;background:transparent;color:rgba(245,235,224,.85);';\n      const now = thenNow === 'now';\n      sel = {\n        id: b.id, title: b.title, year: b.year, village: b.village, contributor: b.contributor,\n        initial: b.initial, added: b.added, likes: b.likes, comments: b.comments, story: b.story,\n        decadeLabel: this._decadeOf(b.year) + '-e',\n        thenOpacity: now ? 0 : 1, nowOpacity: now ? 1 : 0,\n        thenBtn: now ? tabOff : tabOn, nowBtn: now ? tabOn : tabOff,\n      };\n    }\n\n    return {\n      decades, village, villageList, count, countSuffix, recent, sel, addOpen,\n      onVillageChange: (e) => this.setState({ village: e.target.value }),\n      openAdd: () => this.openAdd(), closeAdd: () => this.closeAdd(),\n      closeDetail: () => this.closeDetail(), setThen: () => this.setThen(), setNow: () => this.setNow(),\n      stop: (e) => e.stopPropagation(),\n      openMenu: () => this.setState({ menu: true }), closeMenu: () => this.setState({ menu: false }),\n      menuOpacity: menu ? 1 : 0, menuTransform: menu ? 'translateY(0)' : 'translateY(-4px)', menuEvents: menu ? 'auto' : 'none',\n    };\n  }\n}\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
